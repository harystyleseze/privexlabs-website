# PrivexLabs: SecretVM deployment (https://privexlabs.com)
#
# Upload this file in the SecretVM portal (see: ./scripts/docker/secretvm.sh show).
# The web image is pinned by digest by ./scripts/docker/build-push.sh; do not
# deploy a tag. The site needs no environment file.
#
# Only Traefik publishes ports (80/443). It terminates TLS with the certificate
# SecretVM provides in /mnt/secure/cert (issued for the portal's Custom Domain)
# and routes to the web container through its file provider: there is a single,
# static backend, so Traefik does not need the Docker socket.
#
# Domain: privexlabs.com is set in the `routes` config below (one place).
# www.privexlabs.com is NOT routed: the SecretVM certificate covers only the
# Custom Domain. To serve www, first get a certificate that covers it, then add
# a router for it (see the comment in `routes`).

name: privexlabs

services:
  web:
    image: docker.io/privexlabs/privexlabs-web:unreleased
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    image: traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /mnt/secure/cert:/certs:ro
    configs:
      - source: tls
        target: /etc/traefik/dynamic/tls.yml
      - source: routes
        target: /etc/traefik/dynamic/routes.yml
    # Not read_only: Compose copies inline `configs: content:` into the
    # container, which it refuses to do for a read-only service (and the
    # portal takes a single file, so the configs must stay inline).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        # The image's HEALTHCHECK probes /healthz.
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

configs:
  tls:
    content: |
      tls:
        options:
          # "default" applies to every router; do not reference it as default@file.
          default:
            minVersion: VersionTLS12
        stores:
          default:
            defaultCertificate:
              certFile: /certs/secret_vm_fullchain.pem
              keyFile: /certs/secret_vm_private.pem
  routes:
    content: |
      http:
        routers:
          privexlabs:
            rule: Host(`privexlabs.com`)
            entryPoints:
              - websecure
            service: privexlabs-web
            middlewares:
              - hsts
            tls: {}
          # To serve www once the certificate covers it, add a router with
          # rule Host(`www.privexlabs.com`) and a redirectRegex middleware to
          # https://privexlabs.com/$${1}. Compose interpolates `$`, so the
          # back-reference must be written `$${1}` here.
        middlewares:
          # HSTS for the apex only. Add includeSubDomains/preload only once
          # every subdomain is HTTPS-only; both are hard to undo.
          hsts:
            headers:
              stsSeconds: 31536000
        services:
          privexlabs-web:
            loadBalancer:
              servers:
                - url: http://web:8080
