# Response security headers. nginx does not inherit add_header into a
# location that sets its own add_header, so EVERY location that adds a header
# must `include` this file (see default.conf).
#
# CSP notes:
#   script-src 'self'  the theme bootstrap lives in /theme-init.js (not inline)
#   style-src          'unsafe-inline' is required: NotFoundPage and FatalErrorPage
#                      render a <style> element. It allows CSS only, never script.
#                      (JS-set inline styles go through the CSSOM and need nothing.)
#   fonts              Google Fonts (web/src/index.html, styles/tokens/fonts.css)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
