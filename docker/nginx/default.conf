# PrivexLabs web: static Redwood build (web/dist) on nginx-unprivileged.
# Included by the base image's /etc/nginx/nginx.conf inside `http {}`.
#
# TLS and HSTS are NOT handled here: they belong to whatever terminates TLS
# in front of this container (Traefik on SecretVM, your proxy/LB elsewhere).

server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind a proxy the container's own port/scheme are meaningless; never
    # emit absolute redirects such as http://host:8080/...
    absolute_redirect off;
    port_in_redirect off;

    # Container / orchestrator health probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed Vite output: cache forever; a missing chunk is a real 404 (never
    # the HTML fallback, which the browser would try to execute as JS).
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else: real files (favicons, robots.txt, theme-init.js), then
    # Redwood's SPA fallback. Unknown paths render the client-side NotFoundPage
    # (status 200) so this file never has to mirror web/src/Routes.tsx.
    # no-cache = always revalidate, so a deploy is picked up immediately.
    location / {
        try_files $uri /200.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
