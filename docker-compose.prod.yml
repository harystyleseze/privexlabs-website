# PrivexLabs: production on any Docker host. TLS is terminated upstream (your
# proxy or load balancer, which should also set HSTS); this container serves
# plain HTTP on PRIVEXLABS_PROD_PORT.
#
# Usage: ./scripts/docker/prod.sh up   (or: docker compose -f docker-compose.prod.yml up -d)
#
# The image is pinned by digest by ./scripts/docker/build-push.sh; do not edit
# it by hand. To run an image that has not been pinned yet (e.g. a local
# build), set PRIVEXLABS_WEB_IMAGE.
#
# Publish on loopback only (proxy on the same host):
#   PRIVEXLABS_PROD_PORT=127.0.0.1:8080

name: privexlabs

services:
  web:
    image: ${PRIVEXLABS_WEB_IMAGE:-docker.io/privexlabs/privexlabs-web:unreleased}
    ports:
      - "${PRIVEXLABS_PROD_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
